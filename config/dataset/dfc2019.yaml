defaults:
  - view_sampler: bounded

name: dfc2019
roots: [/project/winston/mvsplat/datasets/DFC2019/overfit/]
make_baseline_1: false
augment: false

# Online random crop (train only).
# Set raw_scenes_dir to the directory containing full-resolution TIF images.
# Leave empty ("") to use the pre-cropped patches in roots[0] (original behaviour).
raw_scenes_dir: /project/winston/mvsplat/datasets/DFC2019/Track3-RGB-1
online_crops_per_scene: 500

image_shape: [128, 128]
background_color: [0.0, 0.0, 0.0]
cameras_are_circular: false

baseline_epsilon: 1e-3
max_fov: 100.0

skip_bad_shape: true
near: -50.0
far: 75.0
baseline_scale_bounds: true
shuffle_val: true
test_len: -1
test_chunk_interval: 1
test_times_per_scene: 1
