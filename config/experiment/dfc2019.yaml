# @package _global_

defaults:
  - override /dataset: dfc2019
  - override /model/encoder: costvolume
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips]

wandb:
  mode: disabled  # 停用 WandB，改用本地 CSV 記錄
  project: mvsplat_skysplat_dfc2019
  entity: null
  name: dfc2019_rpc_training

checkpointing:
  load: checkpoints/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth
  resume: false # only load weights, don't resume training state

mode: train

dataset:
  view_sampler:
    name: bounded
    num_context_views: 3
    num_target_views: 1 # Reconstruction/Novel view is implied by target=context usually or similar
  image_shape: [256, 256]  # Restored to SkySplat training patch size
  # roots 會從 config/dataset/dfc2019.yaml 繼承，不要在這裡重複定義
  # Additional RPC specific params if needed

data_loader:
  train:
    batch_size: 1
    num_workers: 0  # Disable multi-process loading to save memory
  val:
    batch_size: 1
    num_workers: 0
  test:
    batch_size: 1
    num_workers: 0

optimizer:
  lr: 2e-4  # 恢復到原始值（5e-4 導致發散）
  warm_up_steps: 1000  # 適度的 warm-up

trainer:
  num_sanity_val_steps: 0  # Skip sanity check to save memory
  gradient_clip_val: 0.5  # 降低到 0.5 防止梯度爆炸（原本 1.0）
  accumulate_grad_batches: 1  # Disable accumulation for faster overfitting
  val_check_interval: 100  # Validate every 100 steps
  check_val_every_n_epoch: null # Required for step-based validation on small datasets
  max_steps: 500000 # Explicitly set max_steps for OneCycleLR

model:
  encoder:
    d_feature: 128  # Keep 128 to match pretrained weights
    costvolume_unet_feat_dim: 128  # Restore to 128
    depth_unet_feat_dim: 64  # Restore to 64
    num_depth_candidates: 32  # 減少深度平面加速（原 64）
    wo_backbone_cross_attn: false  # Enable cross-view attention
    wo_depth_refine: false # Re-enable U-Net for refinement
    wo_cost_volume: false
    gaussians_per_pixel: 1  # Keep at 1

train_cfg:
  extended_visualization: true
  depth_mode: null
  print_log_every_n_steps: 1
  save_every_n_steps: 100
