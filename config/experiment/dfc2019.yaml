# @package _global_

defaults:
  - override /dataset: dfc2019
  - override /model/encoder: costvolume
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips]

wandb:
  mode: online  
  project: skysplat
  entity: winstonchang9-national-yang-ming-chiao-tung-university
  name: Skysplat

checkpointing:
  load: checkpoints/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth
  resume: false # only load weights, don't resume training state

mode: train

dataset:
  view_sampler:
    name: bounded
    num_context_views: 3
    num_target_views: 1
  image_shape: [256, 256]
  # Overfit to a single scene (online crop mode).
  # Change to null to train on all scenes in raw_scenes_dir.
  overfit_to_scene: JAX_004

data_loader:
  train:
    batch_size: 1
    num_workers: 0  # Disable multi-process loading to save memory
  val:
    batch_size: 1
    num_workers: 0
  test:
    batch_size: 1
    num_workers: 0

optimizer:
  lr: 2e-4
  warm_up_steps: 2000  # 縮短 warm-up：避免 step~6800 時 LR 仍在上升觸發深度崩潰

trainer:
  num_sanity_val_steps: 0  # Skip sanity check to save memory
  gradient_clip_val: 0.3  # 從 0.5 降到 0.3，進一步防止大梯度更新觸發崩潰
  accumulate_grad_batches: 1  # Disable accumulation for faster overfitting
  val_check_interval: 100  # Validate every 100 steps
  check_val_every_n_epoch: null # Required for step-based validation on small datasets
  max_steps: 100000 # Explicitly set max_steps for OneCycleLR

model:
  encoder:
    d_feature: 128  # Keep 128 to match pretrained weights
    costvolume_unet_feat_dim: 128  # Restore to 128
    depth_unet_feat_dim: 64  # Restore to 64
    num_depth_candidates: 32  # 減少深度平面加速（原 64）
    wo_backbone_cross_attn: false  # Enable cross-view attention
    wo_depth_refine: false # Re-enable U-Net for refinement
    wo_cost_volume: false
    gaussians_per_pixel: 1  # Keep at 1

train:
  extended_visualization: true
  depth_mode: null
  print_log_every_n_steps: 1
  damv2_encoder: vitl
  damv2_checkpoint: src/model/encoder/Depth-Anything-V2/checkpoints/depth_anything_v2_vitl.pth
  damv2_observe_every_n_steps: 10
  damv2_loss_weight: 10000.0       # Pearson loss weight; set to 0.0 to disable
  damv2_loss_warmup_steps: 500  # steps before DAMV2 loss is added to total
